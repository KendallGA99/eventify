services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.public
    entrypoint: ["php"]
    command: ["tests/integration/public-no-tls.php"]
    environment:
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:?Falta clave del ensayo}
      PORT: "10000"
      WEATHER_ENABLED: "false"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: eventify_no_tls_test
      DB_USERNAME: eventify_no_tls_test
      DB_PASSWORD: ${MYSQL_PASSWORD:?Falta clave del ensayo}
      DB_TLS_MODE: verify_identity
      DB_TLS_CA: /run/secrets/mysql-ca.pem
    volumes:
      - ${EVENTIFY_TLS_DIR:?Faltan certificados}/ca.pem:/run/secrets/mysql-ca.pem:ro
    networks: [isolated]
  db:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    environment:
      MYSQL_DATABASE: eventify_no_tls_test
      MYSQL_USER: eventify_no_tls_test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta clave del ensayo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta clave del ensayo}
    command: ["mysqld", "--tls-version=", "--require-secure-transport=OFF", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1' --silent >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [isolated]
networks:
  isolated:
    internal: true
