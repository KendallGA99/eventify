name: eventify

services:
  web:
    build:
      context: .
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
      APP_ENV: ${APP_ENV:-local}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Costa_Rica}
      APP_SECRET: ${APP_SECRET:?Ejecute el script de inicio para preparar .env}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-eventify}
      DB_USERNAME: ${MYSQL_USER:-eventify}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en .env}
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "bin/health.php"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - frontend
      - backend
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eventify}
      MYSQL_USER: ${MYSQL_USER:-eventify}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1' --silent >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  app_storage:

networks:
  frontend:
  backend:
    internal: true
