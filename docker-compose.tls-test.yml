services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.public
    environment:
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:?Falta clave del ensayo}
      PORT: "10000"
      WEATHER_ENABLED: "false"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: eventify_tls_test
      DB_USERNAME: eventify_tls_test
      DB_PASSWORD: ${MYSQL_PASSWORD:?Falta clave del ensayo}
      DB_TLS_MODE: verify_identity
      DB_TLS_CA: /run/secrets/mysql-ca.pem
    volumes:
      - ${EVENTIFY_TLS_DIR:?Faltan certificados}/ca.pem:/run/secrets/mysql-ca.pem:ro
      - ${EVENTIFY_TLS_DIR:?Faltan certificados}/wrong-ca.pem:/run/secrets/wrong-ca.pem:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "bin/health.php"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [isolated]
  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    environment:
      MYSQL_DATABASE: eventify_tls_test
      MYSQL_USER: eventify_tls_test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta clave del ensayo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta clave del ensayo}
    entrypoint:
      - bash
      - -ec
      - 'mkdir -p /run/eventify-tls; cp /fixture/ca.pem /fixture/server.pem /fixture/server-key.pem /run/eventify-tls/; chown -R mysql:mysql /run/eventify-tls; chmod 700 /run/eventify-tls; chmod 600 /run/eventify-tls/server-key.pem; exec /usr/local/bin/docker-entrypoint.sh "$$@"'
      - --
    command: ["mysqld", "--ssl-ca=/run/eventify-tls/ca.pem", "--ssl-cert=/run/eventify-tls/server.pem", "--ssl-key=/run/eventify-tls/server-key.pem", "--require-secure-transport=ON", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - ${EVENTIFY_TLS_DIR:?Faltan certificados}:/fixture:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1' --silent >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      isolated:
        aliases: [wrong-host]
networks:
  isolated:
    internal: true
