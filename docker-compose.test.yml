name: eventify-tests

services:
  tests:
    build: .
    security_opt:
      - no-new-privileges:true
    command: ["php", "tests/integration/database.php"]
    environment:
      APP_ENV: test
      WEATHER_ENABLED: "false"
      APP_SECRET: ${APP_SECRET:?Falta APP_SECRET}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: eventify_test
      DB_USERNAME: eventify_test
      DB_PASSWORD: ${MYSQL_PASSWORD:?Ejecute el script para preparar .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [isolated]
  db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    environment:
      MYSQL_DATABASE: eventify_test
      MYSQL_USER: eventify_test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1' --silent >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [isolated]

networks:
  isolated:
    internal: true
